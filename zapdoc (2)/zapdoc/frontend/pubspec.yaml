name: zapdoc
description: ZapDoc - scan documents and edit PDFs, powered by a Python backend.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Camera + capture
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Networking to the Python backend
  http: ^1.2.1

  # File system + file selection
  path_provider: ^2.1.3
  file_picker: ^8.0.6
  open_filex: ^4.4.0
  share_plus: ^9.0.0

  # State management
  provider: ^6.1.2

  # UI helpers
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
